<!-- Scamly logo mark, the master drawing (redesign v3 „Ореол“, final, Phase 2).
     The halo: three concentric arcs that close into a ring around a dot. The outer
     arc is half open, the middle one almost closed, the inner one a full ring, so the
     halo "closes" around the person in the middle. The openings face right and are
     staggered, so the mark reads as a movement, not as a target.
     Geometry (viewBox 32, centre 16/16): outer r 13.6, stroke 2.4, 54 % of the circle;
     middle r 9.6, stroke 2.4, 77 %; inner ring r 5.6, stroke 2.6; dot r 2.4.
     Colours: the halo gradient of the theme (dark „Night“ by default, light „Porcelain“
     when the device asks for light). src/components/ui/HaloLogo.tsx draws the same
     numbers in the page. Our own work, GPL-3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .s1 { stop-color: #8B7BFF } .s2 { stop-color: #4CC9FF } .s3 { stop-color: #6EF3C5 }
    .dot { fill: #F3F4F8 }
    @media (prefers-color-scheme: light) {
      .s1 { stop-color: #5B4BFF } .s2 { stop-color: #0EA5E9 } .s3 { stop-color: #10B981 }
      .dot { fill: #0B0D12 }
    }
  </style>
  <defs>
    <linearGradient id="halo" gradientUnits="userSpaceOnUse" x1="3.8" y1="28.2" x2="28.2" y2="3.8">
      <stop offset="0" class="s1"/>
      <stop offset="0.52" class="s2"/>
      <stop offset="1" class="s3"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#halo)" stroke-linecap="round">
    <circle cx="16" cy="16" r="13.6" stroke-width="2.4" pathLength="100" stroke-dasharray="54 46" transform="rotate(52.8 16 16)"/>
    <circle cx="16" cy="16" r="9.6" stroke-width="2.4" pathLength="100" stroke-dasharray="77 23" transform="rotate(56.4 16 16)"/>
    <circle cx="16" cy="16" r="5.6" stroke-width="2.6"/>
  </g>
  <circle class="dot" cx="16" cy="16" r="2.4"/>
</svg>
