<!-- Scamly maskable icon: the same mark, smaller, so it stays inside the "safe zone"
     (the middle 80 % circle) when Android cuts the icon into a circle, a squircle or
     a drop. Our own work, GPL-3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#3de6f0"/>
  <g transform="translate(16 16) scale(0.6) translate(-16 -16)">
    <path d="M5 16h3l2-7 3 13 2.5-9 1.5 3H27" fill="none" stroke="#03181b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
