<!-- Scamly app icon (redesign v3 „Ореол“, final): the logo mark of logo.svg (the
     same numbers, in a nested 32 × 32 drawing) on the „Night“ colour #05060A, with a
     soft halo glow behind it and a light source in the top-left corner, like the glass
     of the app. Full square: the phone or the browser rounds the corners itself.
     `npm run icons` makes icon-192/512 and apple-touch-icon from it. Our own work, GPL-3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="halo" gradientUnits="userSpaceOnUse" x1="3.8" y1="28.2" x2="28.2" y2="3.8">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="0.52" stop-color="#4CC9FF"/>
      <stop offset="1" stop-color="#6EF3C5"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CC9FF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#8B7BFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx="96" cy="40" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#05060A"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#light)"/>
  <svg x="72" y="72" width="368" height="368" viewBox="0 0 32 32">
    <g fill="none" stroke="url(#halo)" stroke-linecap="round">
      <circle cx="16" cy="16" r="13.6" stroke-width="2.4" pathLength="100" stroke-dasharray="54 46" transform="rotate(52.8 16 16)"/>
      <circle cx="16" cy="16" r="9.6" stroke-width="2.4" pathLength="100" stroke-dasharray="77 23" transform="rotate(56.4 16 16)"/>
      <circle cx="16" cy="16" r="5.6" stroke-width="2.6"/>
    </g>
    <circle cx="16" cy="16" r="2.4" fill="#F3F4F8"/>
  </svg>
</svg>
