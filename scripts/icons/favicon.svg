<!-- Source of src/app/favicon.ico (48 × 48, for old browsers that do not read
     icon.svg): the small logo mark of logo-small.svg on a rounded „Night“ tile, so it
     reads on a light and on a dark tab bar alike. Our own work, GPL-3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="halo" gradientUnits="userSpaceOnUse" x1="1.9" y1="14.1" x2="14.1" y2="1.9">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="0.52" stop-color="#4CC9FF"/>
      <stop offset="1" stop-color="#6EF3C5"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#05060A"/>
  <svg x="6" y="6" width="36" height="36" viewBox="0 0 16 16">
    <g fill="none" stroke="url(#halo)" stroke-linecap="round">
      <circle cx="8" cy="8" r="7" stroke-width="1.8" pathLength="100" stroke-dasharray="72 28" transform="rotate(40.4 8 8)"/>
      <circle cx="8" cy="8" r="4.5" stroke-width="1.9"/>
    </g>
    <circle cx="8" cy="8" r="2" fill="#F3F4F8"/>
  </svg>
</svg>
