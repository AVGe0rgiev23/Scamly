<!-- Scamly notification badge (Android status bar, 24 dp): Android shows only the
     shape (the transparency, not the colours), so this is the small logo mark of
     logo-small.svg in plain white on a transparent background. Our own work, GPL-3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="8" cy="8" r="7" stroke-width="1.8" pathLength="100" stroke-dasharray="72 28" transform="rotate(40.4 8 8)"/>
    <circle cx="8" cy="8" r="4.5" stroke-width="1.9"/>
  </g>
  <circle cx="8" cy="8" r="2" fill="#FFFFFF"/>
</svg>
