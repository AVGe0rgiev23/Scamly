<!doctype html>
<!-- The Open Graph picture (the preview when a Scamly link is shared), 1200 × 630, in
     the redesign v3 „Ореол“ style: the „Night“ page with a Stage on it (the rounded
     hero frame of the app), the halo field glowing at the right (soft rings around a
     bright point, drawn below with the same idea as the app's shader: distance from
     the centre → a cosine wave → rings), the headline with one word in the halo and
     the Scamly logo. scripts/og/generate.mjs opens this page and saves a screenshot to
     src/app/opengraph-image.png. Fonts: our own files in src/fonts/ (file URLs, no
     download). Colours: the dark tokens of src/app/globals.css. Our own work, GPL-3.0. -->
<html lang="bg">
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Sofia Sans";
      src: url(../../src/fonts/SofiaSans.woff2);
      font-weight: 1 1000;
    }
    @font-face {
      font-family: "Sofia Cond";
      src: url(../../src/fonts/SofiaSansSemiCondensed.woff2);
      font-weight: 1 1000;
    }
    :root {
      --bg: #05060a;
      --stage: #0b0d14;
      --text: #f3f4f8;
      --muted: #a3a8b8;
      --halo-1: #8b7bff;
      --halo-2: #4cc9ff;
      --halo-3: #6ef3c5;
    }
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: var(--bg);
      color: var(--text);
      font-family: "Sofia Sans";
      -webkit-font-smoothing: antialiased;
    }
    /* The Stage: 16 px from every edge, 32 px corners, lit from above. */
    .stage {
      position: absolute;
      inset: 16px;
      overflow: hidden;
      border-radius: 32px;
      background: linear-gradient(180deg, #0e1019, var(--stage) 60%);
      border: 1px solid rgb(255 255 255 / 0.1);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.08);
    }
    canvas {
      position: absolute;
      inset: 0;
    }
    /* The light source in the top-left corner of the glass, and a dark veil behind the
       words so the rings never cross the headline. */
    .light {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(60% 70% at 8% 0%, rgb(255 255 255 / 0.06), transparent 60%),
        linear-gradient(90deg, rgb(11 13 20 / 0.92) 0%, rgb(11 13 20 / 0.55) 46%, transparent 64%);
    }
    .content {
      position: absolute;
      inset: 0;
      padding: 64px 72px;
      display: flex;
      flex-direction: column;
    }
    .eyebrow {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 26px 0 0;
      max-width: 760px;
      font: 300 108px/0.94 "Sofia Cond";
      letter-spacing: -0.035em;
    }
    .halo-word {
      font-weight: 700;
      background: linear-gradient(100deg, var(--halo-1), var(--halo-2) 55%, var(--halo-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-bottom: 0.06em;
    }
    .foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1056px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font: 700 46px "Sofia Cond";
      letter-spacing: -0.035em;
    }
    /* The bright pill of the header, as a quiet promise of the one action. */
    .pill {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 8px 8px 26px;
      border-radius: 999px;
      background: #f4f5f8;
      color: #05060a;
      font: 600 24px "Sofia Sans";
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 0.9),
        0 20px 40px -18px rgb(0 0 0 / 0.8);
    }
    .disc {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: #05060a;
      color: #f4f5f8;
    }
  </style>
  <body>
    <div class="stage">
      <canvas id="field" width="1168" height="598"></canvas>
      <div class="light"></div>
      <div class="content">
        <div class="eyebrow">Защита от телефонни измами</div>
        <h1>Обаждат ли ви&nbsp;се<br /><span class="halo-word">за&nbsp;пари?</span></h1>
        <div class="foot">
          <div class="brand">
            <!-- The logo mark: the same numbers as scripts/icons/logo.svg. -->
            <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
              <defs>
                <linearGradient
                  id="halo"
                  gradientUnits="userSpaceOnUse"
                  x1="3.8"
                  y1="28.2"
                  x2="28.2"
                  y2="3.8"
                >
                  <stop offset="0" stop-color="#8B7BFF" />
                  <stop offset="0.52" stop-color="#4CC9FF" />
                  <stop offset="1" stop-color="#6EF3C5" />
                </linearGradient>
              </defs>
              <g fill="none" stroke="url(#halo)" stroke-linecap="round">
                <circle
                  cx="16"
                  cy="16"
                  r="13.6"
                  stroke-width="2.4"
                  pathLength="100"
                  stroke-dasharray="54 46"
                  transform="rotate(52.8 16 16)"
                />
                <circle
                  cx="16"
                  cy="16"
                  r="9.6"
                  stroke-width="2.4"
                  pathLength="100"
                  stroke-dasharray="77 23"
                  transform="rotate(56.4 16 16)"
                />
                <circle cx="16" cy="16" r="5.6" stroke-width="2.6" />
              </g>
              <circle cx="16" cy="16" r="2.4" fill="#F3F4F8" />
            </svg>
            Scamly
          </div>
          <div class="pill">
            Провери обаждане
            <span class="disc">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.25"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </span>
          </div>
        </div>
      </div>
    </div>
    <script>
      // The halo field, one still frame: for every pixel, its distance from the focal
      // point becomes a cosine wave (rings), faded with distance, coloured from iris
      // (inside) through azure to mint (outside), plus a soft glow in the middle and a
      // little grain so the gradients do not show steps.
      const canvas = document.getElementById("field");
      const ctx = canvas.getContext("2d");
      const { width, height } = canvas;
      const image = ctx.createImageData(width, height);
      const cx = 900;
      const cy = 300;
      const stops = [
        [0x8b, 0x7b, 0xff],
        [0x4c, 0xc9, 0xff],
        [0x6e, 0xf3, 0xc5],
      ];
      const mix = (a, b, t) => a + (b - a) * t;
      let seed = 11;
      const random = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const d = Math.hypot(x - cx, (y - cy) * 1.04);
          // Rings that drift apart as they travel out (like sound), sharpened (power 5)
          // so they read as lines of light; every other ring a little brighter.
          const r = Math.pow(d, 0.86);
          const wave = Math.pow(0.5 + 0.5 * Math.cos(r * ((2 * Math.PI) / 26) - 0.9), 5);
          const beat = 0.62 + 0.38 * Math.cos(r * ((2 * Math.PI) / 52) - 0.9);
          const fade = Math.exp(-Math.pow(d / 380, 2));
          // The aurora haze around the rings and the glow in the middle.
          const haze = 0.16 * Math.exp(-Math.pow(d / 260, 2));
          const glow = 0.5 * Math.exp(-Math.pow(d / 54, 2));
          const k = Math.min(1, d / 430);
          const [a, b] = k < 0.5 ? [stops[0], stops[1]] : [stops[1], stops[2]];
          const t = k < 0.5 ? k * 2 : (k - 0.5) * 2;
          const strength =
            Math.min(1, wave * beat * fade * 0.9 + haze + glow) + (random() - 0.5) * 0.025;
          const i = (y * width + x) * 4;
          image.data[i] = mix(a[0], b[0], t);
          image.data[i + 1] = mix(a[1], b[1], t);
          image.data[i + 2] = mix(a[2], b[2], t);
          image.data[i + 3] = Math.max(0, Math.min(255, strength * 255));
        }
      }
      ctx.putImageData(image, 0, 0);
      // The bright point the rings close around.
      const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 13);
      core.addColorStop(0, "rgba(243,244,248,1)");
      core.addColorStop(0.62, "rgba(243,244,248,1)");
      core.addColorStop(1, "rgba(243,244,248,0)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(cx, cy, 13, 0, Math.PI * 2);
      ctx.fill();
    </script>
  </body>
</html>
