<!doctype html>
<!-- The Open Graph picture (the preview when a Scamly link is shared), 1200 × 630.
     scripts/og/generate.mjs opens this page and saves a screenshot to
     src/app/opengraph-image.png. Colours are the dark theme tokens of globals.css. -->
<html lang="bg">
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Sofia Sans";
      src: url(../../src/fonts/SofiaSans.woff2);
      font-weight: 1 1000;
    }
    @font-face {
      font-family: "Sofia Cond";
      src: url(../../src/fonts/SofiaSansSemiCondensed.woff2);
      font-weight: 1 1000;
    }
    @font-face {
      font-family: "JB Mono";
      src: url(../../src/fonts/JetBrainsMono.woff2);
      font-weight: 100 800;
    }
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #080b0f;
      color: #eaf1f5;
      font-family: "Sofia Sans";
    }
    body {
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      padding: 72px 80px;
      background-image:
        linear-gradient(rgb(255 255 255 / 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 0.045) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font: 700 34px "Sofia Cond";
      letter-spacing: -0.02em;
    }
    h1 {
      margin: 44px 0 0;
      font: 700 112px/0.94 "Sofia Cond";
      letter-spacing: -0.03em;
      max-width: 900px;
    }
    p {
      margin: 24px 0 0;
      font-size: 30px;
      line-height: 1.35;
      color: #a8b5c0;
      max-width: 820px;
    }
    svg.trace {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      width: 100%;
      height: 72px;
    }
    .tag {
      position: absolute;
      right: 80px;
      top: 80px;
      font: 500 22px "JB Mono";
      color: #8a98a5;
    }
  </style>
  <body>
    <div class="brand">
      <svg viewBox="0 0 32 32" width="48" height="48">
        <rect x="1" y="1" width="30" height="30" rx="7" fill="#3de6f0" />
        <path
          d="M5 16h3l2-7 3 13 2.5-9 1.5 3H27"
          fill="none"
          stroke="#03181b"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Scamly
    </div>
    <div class="tag">scamly · GPL-3.0</div>
    <h1>Съмнително обаждане?</h1>
    <p>
      Проверете за около 30 секунди дали има признаци на телефонна измама. Близките ви научават
      веднага.
    </p>
    <svg class="trace" viewBox="0 0 1200 90" preserveAspectRatio="none">
      <path id="p" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    </svg>
    <script>
      // Jagged on the left (a scam call), calm on the right (checked).
      let d = "M0 45",
        seed = 7;
      const r = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
      for (let x = 0; x <= 1200; x += 12) {
        const k = Math.max(0, 1 - x / 760);
        d += ` L${x} ${(45 + (r() - 0.5) * 2 * (3 + 38 * k)).toFixed(1)}`;
      }
      const p = document.getElementById("p");
      p.setAttribute("d", d);
      p.setAttribute("stroke", "url(#g)");
      p.parentNode.insertAdjacentHTML(
        "afterbegin",
        '<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff5468"/><stop offset="0.45" stop-color="#f5b93b"/><stop offset="0.7" stop-color="#34d399"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>',
      );
    </script>
  </body>
</html>
