<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Scamly browser-tab icon (interim halo mark, redesign v3; Phase 2 refines it):
       two rings and a dot with thick lines so they read at 16 px. Our own work, GPL-3.0. -->
  <defs>
    <linearGradient id="halo" gradientUnits="userSpaceOnUse" x1="72" y1="440" x2="440" y2="72">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="0.52" stop-color="#4CC9FF"/>
      <stop offset="1" stop-color="#6EF3C5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#05060A"/>
  <g fill="none" stroke="url(#halo)" stroke-linecap="round">
    <circle cx="256" cy="256" r="178" stroke-width="46" pathLength="100" stroke-dasharray="76 24" transform="rotate(-40 256 256)"/>
    <circle cx="256" cy="256" r="98" stroke-width="46"/>
  </g>
  <circle cx="256" cy="256" r="34" fill="#F3F4F8"/>
</svg>
