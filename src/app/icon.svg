<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Scamly browser-tab icon (redesign v3 „Ореол“, final): the small logo mark of
       scripts/icons/logo-small.svg on a transparent background, in the halo colours of
       the dark theme, or of the light theme when the device asks for light, so it reads
       on either tab bar. Our own work, GPL-3.0. -->
  <style>
    .s1 { stop-color: #8B7BFF } .s2 { stop-color: #4CC9FF } .s3 { stop-color: #6EF3C5 }
    .dot { fill: #F3F4F8 }
    @media (prefers-color-scheme: light) {
      .s1 { stop-color: #5B4BFF } .s2 { stop-color: #0EA5E9 } .s3 { stop-color: #10B981 }
      .dot { fill: #0B0D12 }
    }
  </style>
  <defs>
    <linearGradient id="halo" gradientUnits="userSpaceOnUse" x1="1.9" y1="14.1" x2="14.1" y2="1.9">
      <stop offset="0" class="s1"/>
      <stop offset="0.52" class="s2"/>
      <stop offset="1" class="s3"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#halo)" stroke-linecap="round">
    <circle cx="8" cy="8" r="7" stroke-width="1.8" pathLength="100" stroke-dasharray="72 28" transform="rotate(40.4 8 8)"/>
    <circle cx="8" cy="8" r="4.5" stroke-width="1.9"/>
  </g>
  <circle class="dot" cx="8" cy="8" r="2"/>
</svg>
